name: Build Later APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Later project
        run: |
          mkdir extracted
          unzip -q "later (1).zip" -d extracted

          if [ -f "extracted/package.json" ]; then
            PROJECT_ROOT="extracted"
          else
            PROJECT_ROOT=$(dirname "$(find extracted -maxdepth 3 -name package.json | head -n 1)")
          fi

          if [ -z "$PROJECT_ROOT" ] || [ ! -f "$PROJECT_ROOT/package.json" ]; then
            echo "Could not locate package.json inside the extracted zip!"
            find extracted -maxdepth 3
            exit 1
          fi

          echo "Detected project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          cd "$PROJECT_ROOT"
          rm -f package-lock.json
          npm install

      - name: Build web assets
        run: |
          cd "$PROJECT_ROOT"
          npm run build

      - name: Sync native project
        run: |
          cd "$PROJECT_ROOT"
          npx cap sync android

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_ROOT/android/local.properties"

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print debug SHA-1
        run: |
          cd "$PROJECT_ROOT/android"
          chmod +x gradlew
          ./gradlew signingReport

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Later-APK
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/*.apk
