name: Build Later APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Later project
        run: |
          mkdir extracted
          unzip -q "later (1).zip" -d extracted

      - name: Install dependencies
        run: |
          cd extracted
          npm install

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > extracted/android/local.properties

      - name: Build APK
        run: |
          cd extracted/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Later-APK
          path: extracted/android/app/build/outputs/apk/debug/*.apk


