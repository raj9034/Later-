name: Build Later APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Later project
        run: |
          mkdir extracted
          unzip -q "later (1).zip" -d extracted

      - name: Install dependencies
        run: |
          cd extracted
          npm install

      - name: Build APK
        run: |
          cd extracted/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Later-APK
          path: extracted/android/app/build/outputs/apk/debug/*.apk
