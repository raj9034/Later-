name: Build Later APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Later project
        run: |
          mkdir extracted
          unzip -q "later (1).zip" -d extracted

      - name: Install dependencies
        run: |
          cd extracted
          npm install

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find extracted -type f -name gradlew -print -quit | xargs dirname)
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Later-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
