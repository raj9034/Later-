name: Build Later APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Later project
        run: |
          mkdir extracted
          unzip -q "later (1).zip" -d extracted

      - name: Install dependencies
        run: |
          cd extracted
          npm install

      - name: Replace Later app icon
        run: |
          mkdir -p extracted/android/app/src/main/res/drawable
          cp later-icon.png extracted/android/app/src/main/res/drawable/later_icon.png

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("extracted/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          text = re.sub(
              r'android:icon="@[^"]+"',
              'android:icon="@drawable/later_icon"',
              text,
              count=1
          )

          text = re.sub(
              r'android:roundIcon="@[^"]+"',
              'android:roundIcon="@drawable/later_icon"',
              text,
              count=1
          )

          manifest.write_text(text)
          print("Later icon applied successfully.")
          PY

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > extracted/android/local.properties

      - name: Build APK
        run: |
          cd extracted/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Later-APK
          path: extracted/android/app/build/outputs/apk/debug/*.apk
